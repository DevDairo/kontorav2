name: kontora_ops

services:
  docker-api-proxy:
    image: ${OPS_DOCKER_PROXY_IMAGE:-ghcr.io/tecnativa/docker-socket-proxy:v0.4.2}
    container_name: kontora_ops_docker_api
    restart: unless-stopped
    environment:
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      CONTAINERS: "1"
      DISTRIBUTION: "0"
      EVENTS: "0"
      EXEC: "0"
      GRPC: "0"
      IMAGES: "0"
      INFO: "0"
      NETWORKS: "0"
      NODES: "0"
      PING: "1"
      PLUGINS: "0"
      POST: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VERSION: "1"
      VOLUMES: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - docker_readonly

  ops-panel:
    build:
      context: ../../ops-panel
      dockerfile: Dockerfile
    container_name: kontora_ops_panel
    restart: unless-stopped
    stop_grace_period: 10s
    env_file:
      - .env
    environment:
      OPS_ENVIRONMENT: production
      OPS_BIND_ADDRESS: 0.0.0.0
      OPS_PORT: 8090
      OPS_AUTH_MODE: cloudflare-access
      OPS_LOCAL_TOKEN: ""
      OPS_DOCKER_API_URL: http://docker-api-proxy:2375
      OPS_CF_ACCESS_TEAM_DOMAIN: ${OPS_CF_ACCESS_TEAM_DOMAIN:?Defina OPS_CF_ACCESS_TEAM_DOMAIN en infra/ops/.env}
      OPS_CF_ACCESS_AUD: ${OPS_CF_ACCESS_AUD:?Defina OPS_CF_ACCESS_AUD en infra/ops/.env}
      OPS_ALLOWED_EMAILS: ${OPS_ALLOWED_EMAILS:?Defina OPS_ALLOWED_EMAILS en infra/ops/.env}
      OPS_DB_DIAGNOSTICS_ENABLED: ${OPS_DB_DIAGNOSTICS_ENABLED:-false}
      OPS_DB_HOST: ${OPS_DB_HOST:-postgres}
      OPS_DB_PORT: ${OPS_DB_PORT:-5432}
      OPS_DB_NAME: ${OPS_DB_NAME:?Defina OPS_DB_NAME en infra/ops/.env}
      OPS_DB_USER: ${OPS_DB_USER:?Defina OPS_DB_USER en infra/ops/.env}
      OPS_DB_PASSWORD: ${OPS_DB_PASSWORD:?Defina OPS_DB_PASSWORD en infra/ops/.env}
      OPS_DB_SSLMODE: ${OPS_DB_SSLMODE:-disable}
      OPS_STORAGE_BUCKET: ${OPS_STORAGE_BUCKET:?Defina OPS_STORAGE_BUCKET en infra/ops/.env}
      OPS_AUDIT_FILE: /var/lib/kontora-ops/audit.jsonl
      OPS_AUDIT_STORAGE: volume
      OPS_AUDIT_DEFAULT_LIMIT: ${OPS_AUDIT_DEFAULT_LIMIT:-100}
      OPS_AUDIT_MAX_BYTES: ${OPS_AUDIT_MAX_BYTES:-52428800}
      OPS_AUDIT_VOLUME: ${OPS_AUDIT_VOLUME_NAME:-kontora_ops_audit_data}
      OPS_BACKUPS_ENABLED: ${OPS_BACKUPS_ENABLED:-true}
      OPS_EXECUTOR_URL: http://ops-executor:8091
      OPS_EXECUTOR_TOKEN: ${OPS_EXECUTOR_TOKEN:?Defina OPS_EXECUTOR_TOKEN en infra/ops/.env}
      OPS_BACKUP_VOLUME: ${OPS_BACKUP_VOLUME_NAME:-kontora_ops_backups_data}
    depends_on:
      docker-api-proxy:
        condition: service_started
      ops-executor:
        condition: service_healthy
    ports:
      - "${OPS_HOST_BIND_ADDRESS:-127.0.0.1}:${OPS_HOST_PORT:-8090}:8090"
    volumes:
      - ops_audit_data:/var/lib/kontora-ops
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - docker_readonly
      - ops_control
      - pos_database
      - tunnel

  ops-executor:
    build:
      context: ../../ops-executor
      dockerfile: Dockerfile
    container_name: kontora_ops_executor
    restart: unless-stopped
    stop_grace_period: 5m
    environment:
      OPS_ENVIRONMENT: production
      OPS_EXECUTOR_BIND_ADDRESS: 0.0.0.0
      OPS_EXECUTOR_PORT: 8091
      OPS_EXECUTOR_TOKEN: ${OPS_EXECUTOR_TOKEN:?Defina OPS_EXECUTOR_TOKEN en infra/ops/.env}
      OPS_BACKUP_ROOT: /var/lib/kontora-ops/backups
      OPS_STORAGE_SOURCE: /source/storage
      OPS_STORAGE_BUCKET: ${OPS_STORAGE_BUCKET:?Defina OPS_STORAGE_BUCKET en infra/ops/.env}
      OPS_RELEASE_VERSION: ${OPS_RELEASE_VERSION:?Defina OPS_RELEASE_VERSION en infra/ops/.env}
      OPS_POS_COMPOSE_FILES: infra/compose.prod.yml
      OPS_POSTGRES_CONTAINER: ${OPS_POSTGRES_CONTAINER:-kontora_pos_postgres}
      OPS_STORAGE_CONTAINER: ${OPS_STORAGE_CONTAINER:-kontora_pos_storage}
      OPS_BACKEND_CONTAINER: ${OPS_BACKEND_CONTAINER:-kontora_pos_backend}
      OPS_FRONTEND_CONTAINER: ${OPS_FRONTEND_CONTAINER:-kontora_pos_frontend}
      OPS_CLOUDFLARED_CONTAINER: ${OPS_CLOUDFLARED_CONTAINER:-kontora_pos_cloudflared}
      OPS_POSTGRES_VOLUME: ${OPS_POSTGRES_VOLUME:?Defina OPS_POSTGRES_VOLUME en infra/ops/.env}
      OPS_STORAGE_VOLUME: ${OPS_STORAGE_VOLUME:?Defina OPS_STORAGE_VOLUME en infra/ops/.env}
      OPS_BACKUP_TIMEOUT_MS: ${OPS_BACKUP_TIMEOUT_MS:-300000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ops_backups_data:/var/lib/kontora-ops/backups
      - pos_storage_data:/source/storage:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - ops_control

  ops-db-init:
    image: postgres:16-alpine
    profiles:
      - setup
    restart: "no"
    env_file:
      - ../.env
      - .env
    entrypoint:
      - /bin/sh
      - /opt/kontora/init-ops-reader.sh
    volumes:
      - ./scripts/init-ops-reader.sh:/opt/kontora/init-ops-reader.sh:ro
      - ./scripts/init-ops-reader.sql:/opt/kontora/init-ops-reader.sql:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - pos_database

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.7.2}
    container_name: kontora_ops_cloudflared
    restart: unless-stopped
    profiles:
      - tunnel
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      TUNNEL_TOKEN: ${OPS_CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - ops-panel
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - tunnel

networks:
  docker_readonly:
    internal: true
  ops_control:
    internal: true
  pos_database:
    external: true
    name: ${OPS_POS_DATABASE_NETWORK:-infra_database}
  tunnel:

volumes:
  ops_audit_data:
    name: ${OPS_AUDIT_VOLUME_NAME:-kontora_ops_audit_data}
  ops_backups_data:
    name: ${OPS_BACKUP_VOLUME_NAME:-kontora_ops_backups_data}
  pos_storage_data:
    external: true
    name: ${OPS_STORAGE_VOLUME:?Defina OPS_STORAGE_VOLUME en infra/ops/.env}
